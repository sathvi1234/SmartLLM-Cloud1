version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartllm-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: smartllm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartllm_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartllm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartllm-cache
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - smartllm_network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartllm-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:supersecretpassword@postgres:5432/smartllm
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=production_secret_key_change_me_immediately_in_deployment
      - API_V1_STR=/api/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartllm_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartllm-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - smartllm_network

networks:
  smartllm_network:
    driver: bridge

volumes:
  postgres_data:
    name: smartllm_postgres_data
  redis_data:
    name: smartllm_redis_data
