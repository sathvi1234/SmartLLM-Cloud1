name: SmartLLM Cloud CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Production build and typecheck
        run: npm run build
        env:
          # Public API URL only — no provider secrets in CI
          NEXT_PUBLIC_API_URL: https://smartllm-cloud1-1.onrender.com

  backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unreachable Postgres forces the existing SQLite fallback (no secrets / no real DB)
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify python-multipart present
        run: python -c "import multipart; print('python-multipart ok')"

      - name: Import FastAPI application
        run: |
          python -c "from app.main import app; print('app_ok', app.title); print('health_route', any(getattr(r, 'path', None) == '/health' for r in app.routes))"

      - name: Health endpoint returns 200
        run: |
          python -c "from fastapi.testclient import TestClient; from app.main import app; r = TestClient(app).get('/health'); assert r.status_code == 200, r.text; print(r.json())"
